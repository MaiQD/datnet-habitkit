# SUPERSEDED by .github/workflows/deploy.yml.
# Deploy — runs only on push to main. Builds a linux/arm64 image (matching the
# Oracle Cloud Ampere A1 VPS), pushes it to GHCR, then SSHes into the VPS to
# pull and restart the container via the existing docker-compose.yml (ADR-0005).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST     — the VPS's public IP or hostname
#   VPS_USER     — the SSH user to deploy as
#   VPS_SSH_KEY  — private key for that user (public key already on the VPS)
# GITHUB_TOKEN is provided automatically and is sufficient to push to GHCR.
#
# Assumes the VPS has a docker-compose.yml (e.g. in /opt/streak) whose API
# service references the image as:
#   image: ghcr.io/<owner>/<repo>:${IMAGE_TAG}
# with IMAGE_TAG defined in a .env file alongside it (ADR-0008).
name: Deploy

on:
  push:
    branches: [main]

# Prevents two deploys racing each other if pushes land in quick succession.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Only linux/arm64 is built — the VPS architecture is confirmed and
      # fixed (ADR-0009). QEMU lets the (x86_64) hosted runner cross-compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # attach required reviewers here if you want a manual gate
    steps:
      - name: Pull new image and restart the stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/streak
            sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}#" .env
            docker compose pull
            docker compose up -d --remove-orphans

            # Give the container a moment, then confirm it's actually healthy
            # rather than assuming success just because the commands exited 0.
            sleep 5
            docker compose ps --format json | grep -q '"Health":"healthy"' \
              || (echo "::error::Deployed container did not report healthy" && exit 1)

            docker image prune -f

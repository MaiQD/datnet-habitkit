<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<title>Log in · Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171310;
    --surface:#211b15;
    --surface-hi:#2a2319;
    --line:#362d22;
    --text:#f3ece0;
    --muted:#9b8f7d;
    --amber:#ff8a3d;
    --amber-glow:#ffb768;
    --amber-dim:#4a2f18;
    --danger:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .wrap{width:100%;max-width:380px;}
  .brand{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:28px;
  }
  .brand .flame{font-size:26px;}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.02em;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:26px 22px 24px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;margin:0 0 4px;
    text-align:center;letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--muted);font-size:13px;text-align:center;margin:0 0 22px;line-height:1.5;
  }

  .btn{
    width:100%;font-family:inherit;font-size:14.5px;border-radius:10px;padding:12px 14px;
    border:1px solid var(--line);background:var(--surface-hi);color:var(--text);
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn:active{transform:scale(0.99);}

  .btn-google{
    background:#fff;color:#1f1f1f;border:1px solid #d9d9d9;font-weight:500;
  }
  .btn-google svg{flex:none;}

  .divider{
    display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;
    margin:18px 0;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;background:var(--surface-hi);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;
  }
  .field input:focus{outline:none;border-color:var(--amber);}
  .field-error{color:var(--danger);font-size:11.5px;margin-top:5px;display:none;}
  .field-error.show{display:block;}

  .row-between{
    display:flex;justify-content:flex-end;margin:-4px 0 14px;
  }
  .link{
    background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;
    font-family:inherit;padding:0;text-decoration:underline;text-underline-offset:2px;
  }

  .btn-primary{
    background:var(--amber);border-color:var(--amber);color:#221204;font-weight:600;
  }

  .passkey-block{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  }
  .btn-passkey{
    color:var(--amber-glow);border-color:var(--amber-dim);
  }
  .passkey-hint{
    color:var(--muted);font-size:11.5px;text-align:center;margin:10px 0 0;line-height:1.5;
  }

  .footer-link{
    text-align:center;color:var(--muted);font-size:13px;margin-top:20px;
  }
  .footer-link button{
    background:none;border:none;color:var(--amber-glow);font-size:13px;cursor:pointer;
    font-family:inherit;padding:0;font-weight:600;
  }

  .toast-root{
    position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;
    pointer-events:none;width:calc(100% - 32px);max-width:380px;
  }
  .toast{
    background:var(--surface-hi);border:1px solid var(--line);color:var(--text);font-size:13px;
    padding:10px 16px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,0.35);
    opacity:0;transform:translateY(-8px);transition:opacity 0.25s ease, transform 0.25s ease;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="flame">🔥</span><span>Streak</span></div>

    <div class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to keep your streaks going.</p>

      <button class="btn btn-google" id="googleBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 013.68 9c0-.59.1-1.17.28-1.71V4.96H.96A8.99 8.99 0 000 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">or continue with email</div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email or username</label>
          <input id="email" type="text" autocomplete="username" placeholder="you@example.com">
          <div class="field-error" id="emailError">Enter your email or username.</div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          <div class="field-error" id="passwordError">Enter your password.</div>
        </div>
        <div class="row-between">
          <button type="button" class="link" id="forgotBtn">Forgot password?</button>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <div class="passkey-block">
        <button class="btn btn-passkey" id="passkeyBtn" type="button">
          🔑 Log in with a passkey
        </button>
        <p class="passkey-hint">Use your face, fingerprint, or device PIN instead of a password.</p>
      </div>
    </div>

    <p class="footer-link">Don't have an account? <button id="signupBtn">Sign up</button></p>
  </div>

  <div class="toast-root" id="toastRoot"></div>

<script>
(function(){
  // ---------- toast ----------
  let queue = [], busy = false;
  function showToast(msg){ queue.push(msg); processQueue(); }
  function processQueue(){
    if(busy || queue.length===0) return;
    busy = true;
    const msg = queue.shift();
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=>{ el.remove(); busy = false; processQueue(); }, 250);
    }, 2600);
  }

  // ---------- Google button ----------
  // Wire this up to your real OAuth flow (e.g. redirect to your server's
  // /auth/google endpoint, or use Google Identity Services' JS SDK).
  document.getElementById('googleBtn').addEventListener('click', ()=>{
    showToast('Connect this button to your Google OAuth flow to enable it.');
  });

  // ---------- email / password form ----------
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    let valid = true;
    if(!emailInput.value.trim()){
      emailError.classList.add('show');
      valid = false;
    } else {
      emailError.classList.remove('show');
    }
    if(!passwordInput.value){
      passwordError.classList.add('show');
      valid = false;
    } else {
      passwordError.classList.remove('show');
    }
    if(!valid) return;
    // Wire this up to your real auth endpoint (POST credentials, handle
    // the response, redirect on success, show a server error otherwise).
    showToast('Connect this form to your login API to enable it.');
  });

  document.getElementById('forgotBtn').addEventListener('click', ()=>{
    showToast('Wire this up to your password-reset flow.');
  });
  document.getElementById('signupBtn').addEventListener('click', ()=>{
    showToast('Wire this up to your sign-up page.');
  });

  // ---------- passkey (WebAuthn) ----------
  // A real passkey login needs a server: it issues a random challenge via
  // navigator.credentials.get(), then verifies the signed response server-side.
  // This demonstrates the client-side call shape; swap the fetch calls for
  // your actual backend endpoints.
  document.getElementById('passkeyBtn').addEventListener('click', async ()=>{
    if(!window.PublicKeyCredential){
      showToast('This browser doesn\u2019t support passkeys.');
      return;
    }
    try{
      // In production: const challengeRes = await fetch('/auth/passkey/challenge');
      // const options = await challengeRes.json();
      showToast('Connect this to a backend that issues a WebAuthn challenge to enable passkeys.');
    }catch(err){
      showToast('Passkey login isn\u2019t set up yet.');
    }
  });
})();
</script>
</body>
</html>
